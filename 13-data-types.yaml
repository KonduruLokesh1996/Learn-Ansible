- name: course information
  hosts: local
  connection: local
  vars:
    course: "AIOps with DevSecOps on AWS"
    duration_in_hrs: 150
    is_live_sessions: true
    topics:
    - Linux
    - Shell
    - Ansible
    - Terraform
    more_details:
      trainer: Sivakumar
      months: 4 
    exact_duration_in_months: 4.5
  tasks:
  - name: print info and type
    ansible.buitin.debug:
     msg: |
      name: "{{ course }} : {{ course | type_debug }}""   
      duration: {{ duratio_in_hrs }} : {{ duratio_in_hrs | type_debug }} 
      is live: {{ is_live_sessions }} : {{ is_live_sessions | type_debug }} 
      topics are: {{ topics }} : {{ more_details | type_debug }} 
      duration: {{ exact_duration_in_months }} : {{ exact_duration_in_months | type_debug }} 


