- name: even or odd
  hosts: local
  connection: local
  vars:
    given_number: 10
  tasks:
  - name: is even
    ansible.builtin.debug:
      msg: "Given number: {{ given _number }} is even"
    when: given_number % 2 == 0
- name: is odd
     ansible.builtin.debug:
      msg: "Given number: {{ given _number }} is odd"
    when: given_number % 2 != 0






