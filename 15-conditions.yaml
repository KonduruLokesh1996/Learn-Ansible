- name: print OS is RedHat or not
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: install nginx in RedHat
    dnf:
      state: present
      name: nginx
    when: ansible_facts.os_family == "RedHat" 
  - name: install nginx in "debian"
    apt:
      state: present
      name: nginx
    when: ansible_facts.os_family == "Debian" 




