- name: print OS RedHat or not
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: install nginx in "RedHat"
    dnf:
      state: present
      name: nginx
    when: ansible_fatcs.osfamily == "RedHat" 
 - name: install nginx in "debian"
    dnf:
      state: present
      name: nginx
    when: ansible_fatcs.osfamily == "Debian" 




