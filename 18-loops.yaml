- name: install package
  hosts: local
  connection: local
  become: yes
  vars:
    packages:
    - { name: 'nginx', state: 'absent' }
    - { name: 'mysql', state: 'present' }
    - { name: 'git', state: 'absent' } 
    - { name: 'net-tools', state: 'present' }
    - { name: 'htop', state: 'present' }
  tasks:
  - name: instal packages
    package: 
      name: "{{ item.name }}"
      state: "{{item.state}}"
    loop: "{{ packages }}"    
